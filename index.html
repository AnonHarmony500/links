<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nemesis Links</title>
  <link rel="icon" type="image/png" href="favicon1.png">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffcce6, #f3d9ff, #d6f0ff);
    }

    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(255, 182, 193, 0.4);
      z-index: 1000;
    }

    .nav-inner {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      color: #5a5a7a;
    }

    .nav-links a {
      margin-left: 15px;
      text-decoration: none;
      color: #c77dff;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #a855f7;
    }

    .nav-links a.active {
      color: #ff8acb;
      text-shadow: 0 0 8px rgba(255, 138, 203, 0.6);
    }

    .container {
      max-width: 500px;
      width: 90%;
      margin: 100px auto 50px;
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.5);
    }

    .mascot {
      width: 90px;
      margin-top: 15px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #5a5a7a;
    }

    p {
      margin-top: 10px;
      font-size: 1rem;
      color: #666;
    }

    .input-group {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-group select,
    .input-group input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 0.95rem;
    }

    select {
      background: #ffd6f0;
      color: #5a5a7a;
      font-weight: bold;
      transition: 0.2s ease;
    }

    select:focus {
      box-shadow: 0 0 10px rgba(255, 138, 203, 0.6);
    }

    input {
      background: #ffffffaa;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: #ffb3d9;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #b89cff;
      transform: translateY(-1px);
    }

    .shorten-btn {
      margin-top: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .news-button {
      margin-top: 15px;
      background: #a0c4ff;
    }

    .news-button:hover {
      background: #89b4ff;
    }

    .links {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #888;
    }

    .links span {
      display: block;
      margin-top: 5px;
    }

    footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* shortened URL card, hidden by default */
    #result-container {
      display: none;
      margin-top: 20px;
      background: #ffd6f0;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #5a5a7a;
      box-shadow: 0 0 10px rgba(255, 138, 203, 0.6);
      word-break: break-all;
    }

    #copy-btn {
      padding: 6px 10px;
      border-radius: 8px;
      background: #ffb3d9;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #copy-btn:hover {
      background: #b89cff;
      transform: translateY(-1px);
    }

    @media (max-width: 500px) {
      .input-group {
        flex-direction: column;
      }
      input, select, button {
        width: 100%;
      }
      .logo {
        font-size: 0.9rem;
      }
      .nav-links a {
        margin-left: 10px;
        font-size: 0.9rem;
      }
      #result-container {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="navbar">
    <div class="nav-inner">
      <span class="logo">✧ Nemesis ✧</span>
      <div class="nav-links">
        <a href="/" class="active">home</a>
        <a href="/news">news</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Nemesis Links</h1>
      <p>curated signals, fragments, transmissions</p>
      <img src="mascot.png" class="mascot">

      <div class="input-group">
        <select id="category">
          <option value="america">america</option>
          <option value="europe">europe</option>
          <option value="russia">russia</option>
          <option value="ukraine">ukraine</option>
          <option value="china">china</option>
          <option value="middle-east">middle east</option>
          <option value="other">other</option>
        </select>

        <input id="url" placeholder="paste full URL" />
      </div>

      <button class="shorten-btn" onclick="shorten()">shorten</button>

      <div id="result-container">
        <span id="result"></span>
        <button id="copy-btn" onclick="copyUrl()">copy</button>
      </div>

      <a href="/news">
        <button class="news-button">view news feed ✧</button>
      </a>

      <div class="links">
        <span>example:</span>
        <span>/middle_east-01</span>
        <span>/ukraine-223</span>
        <span>/america-51</span>
      </div>

      <footer>
        nothing is random and nothing will be forgiven
      </footer>
    </div>
  </div>

  <script>
    async function shorten() {
      const category = document.getElementById("category").value;
      const url = document.getElementById("url").value;
      if (!url) return;

      const res = await fetch("/.netlify/functions/shorten", {
        method: "POST",
        body: JSON.stringify({ category, url })
      });

      const data = await res.json();
      const resultContainer = document.getElementById("result-container");
      const resultText = document.getElementById("result");

      resultText.innerText = data.shortUrl;
      resultContainer.style.display = "flex";
    }

    function copyUrl() {
      const resultText = document.getElementById("result").innerText;
      navigator.clipboard.writeText(resultText);
      // no alert popup anymore
    }
  </script>
</body>
</html>

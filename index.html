<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nemesis Links</title>
  <link rel="icon" type="image/png" href="/favicon1.png">
  <style>
    /* body and layout */
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffcce6, #f3d9ff, #d6f0ff);
    }

    /* sticky navbar */
    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(255, 182, 193, 0.4);
      z-index: 1000;
    }

    .nav-inner {
      max-width: 900px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      color: #5a5a7a;
    }

    .nav-links a {
      margin-left: 15px;
      text-decoration: none;
      color: #c77dff;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #a855f7;
    }

    .nav-links a.active {
      color: #ff8acb;
      text-shadow: 0 0 8px rgba(255, 138, 203, 0.6);
    }

    /* main container */
    .container {
      max-width: 500px;
      width: 90%;
      margin: 100px auto 50px; /* push below navbar */
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.5);
    }

    .mascot {
      width: 90px;
      margin-top: 15px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #5a5a7a;
    }

    p {
      margin-top: 10px;
      font-size: 1rem;
      color: #666;
    }

    .input-group {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    select, input {
      width: 80%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: #ffffffaa;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    /* shorten button */
    .shorten-btn {
      background: #ffb3d9;
      color: white;
    }

    .shorten-btn:hover {
      background: #ff99cc;
      transform: translateY(-1px);
    }

    /* news feed button */
    .news-button {
      margin-top: 15px;
      background: #a0c4ff;
      color: white;
    }

    .news-button:hover {
      background: #89b4ff;
    }

    /* result container */
    #result-container {
      display: none;
      margin-top: 15px;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    #result {
      background: #ffffffcc;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      color: #5a5a7a;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #copy-btn {
      background: #ffb3ff;
      width: 80px; /* fixed width to prevent shift */
    }

    #copy-btn:hover {
      background: #ffa3ff;
    }

    .links {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #888;
    }

    .links span {
      display: block;
      margin-top: 5px;
    }

    footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* mobile tweaks */
    @media (max-width: 500px) {
      .input-group {
        width: 100%;
      }
      select, input, button {
        width: 90%;
      }
      .logo {
        font-size: 0.9rem;
      }
      .nav-links a {
        margin-left: 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- sticky navbar -->
  <div class="navbar">
    <div class="nav-inner">
      <span class="logo">✧ Nemesis ✧</span>
      <div class="nav-links">
        <a href="/" class="active">home</a>
        <a href="/news">news</a>
      </div>
    </div>
  </div>

  <!-- main content -->
  <div class="container">
    <div class="card">
      <h1>Nemesis Links</h1>
      <p>curated signals, fragments, transmissions</p>

      <img src="mascot.png" class="mascot">

      <div class="input-group">
        <select id="category">
          <option value="america">america</option>
          <option value="europe">europe</option>
          <option value="russia">russia</option>
          <option value="ukraine">ukraine</option>
          <option value="china">china</option>
          <option value="middle-east">middle east</option>
          <option value="other">other</option>
        </select>

        <input id="url" placeholder="paste full URL" />

        <button class="shorten-btn" onclick="shorten()">shorten</button>
      </div>

      <div id="result-container">
        <span id="result"></span>
        <button id="copy-btn" onclick="copyUrl()">Copy</button>
      </div>

      <a href="/news">
        <button class="news-button">view news feed ✧</button>
      </a>

      <div class="links">
        <span>example:</span>
        <span>/middle_east-01</span>
        <span>/ukraine-223</span>
        <span>/america-51</span>
      </div>

      <footer>
        nothing is random and nothing will be forgiven
      </footer>
    </div>
  </div>

<script>
async function shorten() {
  const category = document.getElementById("category").value;
  const url = document.getElementById("url").value.trim();
  if (!url) return; // do nothing if empty

  try {
    const res = await fetch("/.netlify/functions/shorten", {
      method: "POST",
      body: JSON.stringify({ category, url })
    });
    const data = await res.json();

    if (data.shortUrl) {
      const resultContainer = document.getElementById("result-container");
      const resultText = document.getElementById("result");
      resultText.innerText = data.shortUrl;
      resultContainer.style.display = "flex"; // show result + copy
      document.getElementById("copy-btn").innerText = "Copy"; // reset button text
    }
  } catch (err) {
    console.error("Error shortening URL:", err);
  }
}

function copyUrl() {
  const resultText = document.getElementById("result").innerText;
  navigator.clipboard.writeText(resultText);

  const copyBtn = document.getElementById("copy-btn");
  copyBtn.innerText = "Copied!";

  setTimeout(() => {
    copyBtn.innerText = "Copy";
  }, 1500);
}
</script>
</body>
</html>
